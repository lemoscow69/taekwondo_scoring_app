<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taekwondo Referee Scoring</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#10131a;
  color:white;
  text-align:center;
}

header{
  padding:18px;
  font-size:28px;
  font-weight:bold;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 22px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

.start{background:#168cff}
.pause{background:#6757e8}
.end{background:#ed3948}
.direct{background:#ed3948}
.new{background:#16bfa5}
.settings{background:#333;padding:10px 18px}

.timer{
  font-size:52px;
  font-weight:bold;
  margin-top:10px;
}

.roundInfo{
  font-size:24px;
  margin:8px;
}

.match{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

.player{
  padding:20px;
  border-radius:20px;
  background:#222b38;
}

.player.red{background:#a62d45}
.player.blue{background:#176a78}

.name{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.score{
  font-size:90px;
  font-weight:bold;
}

.scoreButtons{
  display:flex;
  justify-content:center;
  gap:15px;
}

.scoreButtons button{
  width:90px;
  font-size:35px;
  background:#16bfa5;
}

.scoreButtons button:first-child{
  background:#555;
}

.gam{
  margin-top:12px;
  font-size:20px;
}

.gam button{
  margin-top:8px;
  background:#555;
  font-size:16px;
}

.rounds{
  margin-top:12px;
  font-size:18px;
}

.winner{
  font-size:30px;
  font-weight:bold;
  margin:15px;
  min-height:40px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  justify-content:center;
  align-items:center;
  z-index:10;
}

.modalBox{
  background:#202733;
  padding:25px;
  border-radius:18px;
  width:min(90%,420px);
}

.modalBox h2{
  margin-top:0;
}

.modalBox label{
  display:block;
  text-align:left;
  margin-top:12px;
}

.modalBox input,
.modalBox select{
  width:100%;
  padding:12px;
  margin-top:5px;
  border-radius:8px;
  border:0;
  font-size:16px;
}

.modalBox button{
  margin-top:15px;
}

.save{
  background:#16bfa5;
}

.close{
  background:#555;
}

.directWinnerBtn{
  display:block;
  width:100%;
  margin:10px 0;
  background:#444;
}

@media(max-width:700px){
  .match{
    grid-template-columns:1fr;
  }

  .score{
    font-size:70px;
  }

  .timer{
    font-size:42px;
  }
}
</style>
</head>

<body>

<header>🥋 TAEKWONDO SCORING</header>

<div class="topbar">
  <button class="start" onclick="startTimer()">START</button>
  <button class="pause" onclick="pauseTimer()">PAUSE</button>
  <button class="end" onclick="endRound()">END ROUND</button>
  <button class="direct" onclick="openDirectWinner()">DIRECT WINNER</button>
  <button class="new" onclick="newMatch()">NEW MATCH</button>
</div>

<div class="timer" id="timer">01:00</div>
<div class="roundInfo" id="roundInfo">ROUND 1 / 3</div>

<div class="match">

  <div class="player red">
    <div class="name" id="player1Name">HONG CHONG</div>

    <div class="score" id="score1">0</div>

    <div class="scoreButtons">
      <button onclick="changeScore(1,-1)">−</button>
      <button onclick="changeScore(1,1)">+</button>
    </div>

    <div class="gam">
      GAM-JEOM: <span id="gam1">0</span><br>
      <button onclick="giveGamjeom(1)">+ GAM-JEOM</button>
    </div>

    <div class="rounds">
      ROUNDS WON: <span id="rounds1">0</span>
    </div>
  </div>

  <div class="player blue">
    <div class="name" id="player2Name">BLUE PLAYER</div>

    <div class="score" id="score2">0</div>

    <div class="scoreButtons">
      <button onclick="changeScore(2,-1)">−</button>
      <button onclick="changeScore(2,1)">+</button>
    </div>

    <div class="gam">
      GAM-JEOM: <span id="gam2">0</span><br>
      <button onclick="giveGamjeom(2)">+ GAM-JEOM</button>
    </div>

    <div class="rounds">
      ROUNDS WON: <span id="rounds2">0</span>
    </div>
  </div>
  </div>

<div class="winner" id="winner"></div>

<button class="settings" onclick="openSettings()">⚙ MATCH SETTINGS</button>


<!-- SETTINGS MODAL -->

<div class="modal" id="settingsModal">
  <div class="modalBox">

    <h2>⚙ Match Settings</h2>

    <label>Player 1 Name</label>
    <input id="setPlayer1" type="text">

    <label>Player 2 Name</label>
    <input id="setPlayer2" type="text">

    <label>Round Time (seconds)</label>
    <input id="setTime" type="number" min="10">

    <label>Best Of</label>
    <select id="setBestOf">
      <option value="1">1 Round</option>
      <option value="3">3 Rounds</option>
      <option value="5">5 Rounds</option>
    </select>

    <label>Gam-jeom Disqualification Limit</label>
    <input id="setGamLimit" type="number" min="1">

    <label>Score Size</label>
    <select id="setScoreSize">
      <option value="70">Small</option>
      <option value="90">Medium</option>
      <option value="120">Large</option>
    </select>

    <br>

    <button class="save" onclick="saveSettings()">SAVE SETTINGS</button>
    <button class="close" onclick="closeSettings()">CLOSE</button>

  </div>
</div>


<!-- DIRECT WINNER MODAL -->

<div class="modal" id="directModal">
  <div class="modalBox">

    <h2>🏆 Direct Winner</h2>

    <button class="directWinnerBtn" onclick="setDirectWinner(1)">
      HONG CHONG WINS
    </button>

    <button class="directWinnerBtn" onclick="setDirectWinner(2)">
      BLUE PLAYER WINS
    </button>

    <h3>Reason</h3>

    <button class="directWinnerBtn" onclick="setWinnerReason('Walkover')">
      Walkover / Opponent Did Not Fight
    </button>

    <button class="directWinnerBtn" onclick="setWinnerReason('Withdrawal')">
      Opponent Withdrawal
    </button>

    <button class="directWinnerBtn" onclick="setWinnerReason('Injury')">
      Injury
    </button>

    <button class="close" onclick="closeDirectWinner()">CLOSE</button>

  </div>
</div>


<script>

let settings = {
  player1: "HONG CHONG",
  player2: "BLUE PLAYER",
  roundTime: 60,
  bestOf: 3,
  gamLimit: 10,
  scoreSize: 90
};

let score1 = 0;
let score2 = 0;

let gam1 = 0;
let gam2 = 0;

let rounds1 = 0;
let rounds2 = 0;

let currentRound = 1;
let timeLeft = settings.roundTime;

let timerInterval = null;
let running = false;

let directWinnerPlayer = null;


/* SCORE */

function changeScore(player, amount){

  if(player === 1){
    score1 += amount;

    if(score1 < 0){
      score1 = 0;
    }
  }

  if(player === 2){
    score2 += amount;

    if(score2 < 0){
      score2 = 0;
    }
  }

  updateDisplay();
}


/* GAM-JEOM */

function giveGamjeom(player){

  if(player === 1){

    gam1++;

    score2++;

    if(gam1 >= settings.gamLimit){
      showWinner(2,"Gam-jeom Limit");
      return;
    }
  }

  if(player === 2){

    gam2++;

    score1++;

    if(gam2 >= settings.gamLimit){
      showWinner(1,"Gam-jeom Limit");
      return;
    }
  }

  updateDisplay();
}


/* TIMER */

function startTimer(){

  if(running){
    return;
  }

  running = true;

  timerInterval = setInterval(function(){

    if(timeLeft > 0){

      timeLeft--;

      updateTimer();

    }else{

      clearInterval(timerInterval);

      running = false;

      endRound();

    }

  },1000);
}


function pauseTimer(){

  clearInterval(timerInterval);

  running = false;

}


function endRound(){

  clearInterval(timerInterval);

  running = false;

  if(score1 > score2){

    rounds1++;

  }else if(score2 > score1){

    rounds2++;

  }

  updateDisplay();

  checkMatchWinner();

}


/* MATCH WINNER */

function checkMatchWinner(){

  let needed = Math.ceil(settings.bestOf / 2);

  if(rounds1 >= needed){

    showWinner(1,"Match Winner");

    return;

  }

  if(rounds2 >= needed){

    showWinner(2,"Match Winner");

    return;

  }

  currentRound++;

  if(currentRound <= settings.bestOf){

    score1 = 0;
    score2 = 0;

    gam1 = 0;
    gam2 = 0;

    timeLeft = settings.roundTime;

    updateDisplay();

  }

}


/* WINNER */

function showWinner(player,reason){

  clearInterval(timerInterval);

  running = false;
    let name = player === 1 ? settings.player1 : settings.player2;

  document.getElementById("winner").innerHTML =
    "🏆 WINNER: " + name + "<br><small>" + reason + "</small>";

}


/* DIRECT WINNER */

function openDirectWinner(){

  document.getElementById("directModal").style.display = "flex";

}


function closeDirectWinner(){

  document.getElementById("directModal").style.display = "none";

  directWinnerPlayer = null;

}


function setDirectWinner(player){

  directWinnerPlayer = player;

}


function setWinnerReason(reason){

  if(directWinnerPlayer === null){

    alert("First select the winner.");

    return;

  }

  let name =
    directWinnerPlayer === 1
    ? settings.player1
    : settings.player2;

  document.getElementById("winner").innerHTML =
    "🏆 WINNER: " + name +
    "<br><small>" + reason + "</small>";

  closeDirectWinner();

}


/* SETTINGS */

function openSettings(){

  document.getElementById("setPlayer1").value = settings.player1;

  document.getElementById("setPlayer2").value = settings.player2;

  document.getElementById("setTime").value = settings.roundTime;

  document.getElementById("setBestOf").value = settings.bestOf;

  document.getElementById("setGamLimit").value = settings.gamLimit;

  document.getElementById("setScoreSize").value = settings.scoreSize;

  document.getElementById("settingsModal").style.display = "flex";

}


function closeSettings(){

  document.getElementById("settingsModal").style.display = "none";

}


function saveSettings(){

  settings.player1 =
    document.getElementById("setPlayer1").value || "RED PLAYER";

  settings.player2 =
    document.getElementById("setPlayer2").value || "BLUE PLAYER";

  settings.roundTime =
    Number(document.getElementById("setTime").value) || 60;

  settings.bestOf =
    Number(document.getElementById("setBestOf").value) || 3;

  settings.gamLimit =
    Number(document.getElementById("setGamLimit").value) || 10;

  settings.scoreSize =
    Number(document.getElementById("setScoreSize").value) || 90;

  timeLeft = settings.roundTime;

  document.querySelectorAll(".score").forEach(function(el){

    el.style.fontSize = settings.scoreSize + "px";

  });

  updateDisplay();

  closeSettings();

}


/* NEW MATCH */

function newMatch(){

  clearInterval(timerInterval);

  running = false;

  score1 = 0;
  score2 = 0;

  gam1 = 0;
  gam2 = 0;

  rounds1 = 0;
  rounds2 = 0;

  currentRound = 1;

  timeLeft = settings.roundTime;

  document.getElementById("winner").innerHTML = "";

  updateDisplay();

}


/* DISPLAY */

function updateTimer(){

  let minutes =
    Math.floor(timeLeft / 60);

  let seconds =
    timeLeft % 60;

  document.getElementById("timer").innerText =
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");

}


function updateDisplay(){

  document.getElementById("player1Name").innerText =
    settings.player1;

  document.getElementById("player2Name").innerText =
    settings.player2;

  document.getElementById("score1").innerText =
    score1;

  document.getElementById("score2").innerText =
    score2;

  document.getElementById("gam1").innerText =
    gam1;

  document.getElementById("gam2").innerText =
    gam2;

  document.getElementById("rounds1").innerText =
    rounds1;

  document.getElementById("rounds2").innerText =
    rounds2;

  document.getElementById("roundInfo").innerText =
    "ROUND " + currentRound + " / " + settings.bestOf;

  updateTimer();

}


/* INITIALIZE */

updateDisplay();

</script>

</body>
</html>
