<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taekwondo Scoring</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff;
}

header{
    text-align:center;
    padding:18px;
    background:#181818;
    font-size:26px;
    font-weight:bold;
    border-bottom:2px solid #333;
}

.top-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.start{background:#1faa59;color:white}
.pause{background:#f39c12;color:white}
.end{background:#e74c3c;color:white}
.direct{background:#9b59b6;color:white}
.new{background:#34495e;color:white}
.settings-btn{background:#555;color:white}

.match-info{
    text-align:center;
    margin:5px 0 15px;
}

.round{
    font-size:20px;
    font-weight:bold;
}

.timer{
    font-size:52px;
    font-weight:bold;
    margin-top:5px;
}

.players{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:15px;
}

.player{
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.red{background:#9e2020}
.blue{background:#154f9e}

.player-name{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.score{
    font-size:80px;
    font-weight:bold;
    margin:10px;
}

.score-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
}

.score-buttons button{
    width:70px;
    height:55px;
    font-size:30px;
}

.minus{
    background:#222;
    color:white;
}

.plus{
    background:#f1f1f1;
    color:#111;
}

.gamjeom{
    margin-top:18px;
    font-size:18px;
}

.gamjeom button{
    margin-top:8px;
    background:#111;
    color:white;
}

.rounds{
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
}

.bottom{
    text-align:center;
    padding:10px 15px 25px;
}

#winnerText{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

/* POPUPS */

.winner-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.84);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.winner-box{
    background:#151515;
    border:3px solid gold;
    border-radius:18px;
    padding:35px;
    width:90%;
    max-width:500px;
    text-align:center;
    animation:pop .3s ease;
}

.winner-box h1{
    color:gold;
    font-size:38px;
    margin:0 0 15px;
}

.winner-box h2{
    font-size:34px;
    margin:10px 0;
}

.winner-box p{
    font-size:18px;
    color:#ccc;
}

@keyframes pop{
    from{transform:scale(.5);opacity:0}
    to{transform:scale(1);opacity:1}
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:900;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    background:#1c1c1c;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    padding:25px;
    border-radius:15px;
}

.modal-box h2{
    text-align:center;
    margin-top:0;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.field input,
.field select{
    width:100%;
    padding:12px;
    border-radius:7px;
    border:1px solid #555;
    background:#111;
    color:white;
    font-size:16px;
}

.checkbox-field{
    display:flex;
    align-items:center;
    gap:10px;
    margin:12px 0;
}

.checkbox-field input{
    width:20px;
    height:20px;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
}

.save{background:#1faa59;color:white}
.close{background:#555;color:white}

.direct-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.winner-select{
    background:#333;
    color:white;
}

.winner-select.selected{
    background:gold;
    color:#111;
}
    @media(max-width:700px){
    .players{grid-template-columns:1fr}
    .score{font-size:65px}
    .timer{font-size:44px}
    header{font-size:22px}
}
</style>
</head>

<body>

<header>🥋 TAEKWONDO SCORING</header>

<div class="top-controls">
    <button class="start" onclick="startTimer()">START</button>
    <button class="pause" onclick="pauseTimer()">PAUSE</button>
    <button class="end" onclick="endRound()">END ROUND</button>
    <button class="direct" onclick="openDirectWinner()">DIRECT WINNER</button>
    <button class="new" onclick="newMatch()">NEW MATCH</button>
</div>

<div class="match-info">
    <div class="round" id="roundDisplay">ROUND 1</div>
    <div class="timer" id="timer">01:00</div>
</div>

<div class="players">

    <div class="player red">

        <div class="player-name" id="player1Name">HONG</div>

        <div class="score" id="score1">0</div>

        <div class="score-buttons">
            <button class="minus" onclick="changeScore(1,-1)">−</button>
            <button class="plus" onclick="changeScore(1,1)">+</button>
        </div>

        <div class="gamjeom">
            Gam-jeom: <strong id="gam1">0</strong><br>
            <button onclick="giveGamjeom(1)">+ GAM-JEOM</button>
        </div>

        <div class="rounds">
            Rounds Won: <span id="rounds1">0</span>
        </div>

    </div>


    <div class="player blue">

        <div class="player-name" id="player2Name">CHONG</div>

        <div class="score" id="score2">0</div>

        <div class="score-buttons">
            <button class="minus" onclick="changeScore(2,-1)">−</button>
            <button class="plus" onclick="changeScore(2,1)">+</button>
        </div>

        <div class="gamjeom">
            Gam-jeom: <strong id="gam2">0</strong><br>
            <button onclick="giveGamjeom(2)">+ GAM-JEOM</button>
        </div>

        <div class="rounds">
            Rounds Won: <span id="rounds2">0</span>
        </div>

    </div>

</div>

<div class="bottom">

    <button class="settings-btn" onclick="openSettings()">
        ⚙ MATCH SETTINGS
    </button>

    <div id="winnerText"></div>

</div>


<!-- MATCH WINNER POPUP -->

<div class="winner-overlay" id="winnerOverlay">

    <div class="winner-box">

        <h1>🏆 MATCH WINNER</h1>

        <h2 id="winnerName">HONG</h2>

        <p id="winnerReason">Match Winner</p>

        <button class="save" onclick="closeWinnerPopup()">
            CLOSE
        </button>

    </div>

</div>


<!-- ROUND WINNER POPUP -->

<div class="winner-overlay" id="roundWinnerOverlay">

    <div class="winner-box">

        <h1>🏆 ROUND WINNER</h1>

        <h2 id="roundWinnerName">HONG</h2>

        <p id="roundWinnerReason">Won Round 1</p>

        <button class="save" onclick="nextRound()">
            NEXT ROUND
        </button>

    </div>

</div>


<!-- MATCH SETTINGS -->

<div class="modal" id="settingsModal">

    <div class="modal-box">

        <h2>⚙ MATCH SETTINGS</h2>

        <div class="field">
            <label>Player 1 Name</label>
            <input type="text" id="settingsPlayer1" value="HONG">
        </div>

        <div class="field">
            <label>Player 2 Name</label>
            <input type="text" id="settingsPlayer2" value="CHONG">
        </div>

        <div class="field">
            <label>Round Time (Seconds)</label>
            <input type="number" id="settingsRoundTime" min="10" value="60">
        </div>

        <div class="field">
            <label>Best Of</label>
            <select id="settingsBestOf">
                <option value="1">Best of 1</option>
                <option value="3" selected>Best of 3</option>
                <option value="5">Best of 5</option>
            </select>
        </div>

        <div class="field">
            <label>Gam-jeom Limit</label>
            <input type="number" id="settingsGamLimit" min="1" value="10">
        </div>

        <div class="field">
            <label>Point Gap</label>
            <input type="number" id="settingsPointGap" min="1" value="12">
        </div>
        <div class="checkbox-field">
            <input type="checkbox" id="settingsPointGapEnabled" checked>
            <label>Enable Point Gap Rule</label>
        </div>

        <div class="field">
            <label>Target Score</label>
            <input type="number" id="settingsTargetScore" min="1" value="20">
        </div>

        <div class="checkbox-field">
            <input type="checkbox" id="settingsTargetScoreEnabled" checked>
            <label>Enable Target Score Rule</label>
        </div>

        <div class="field">
            <label>Score Size</label>
            <select id="settingsScoreSize">
                <option value="60">Small</option>
                <option value="80" selected>Normal</option>
                <option value="100">Large</option>
            </select>
        </div>

        <div class="modal-buttons">
            <button class="save" onclick="saveSettings()">
                SAVE SETTINGS
            </button>

            <button class="close" onclick="closeSettings()">
                CLOSE
            </button>
        </div>

    </div>

</div>


<!-- DIRECT WINNER -->

<div class="modal" id="directWinnerModal">

    <div class="modal-box">

        <h2>🏆 DIRECT MATCH WINNER</h2>

        <div class="direct-buttons">

            <button class="winner-select"
                    id="selectP1"
                    onclick="selectWinner(1)">
                HONG WINS
            </button>

            <button class="winner-select"
                    id="selectP2"
                    onclick="selectWinner(2)">
                CHONG WINS
            </button>

        </div>

        <div class="field" style="margin-top:20px">

            <label>Reason</label>

            <select id="directReason">

                <option>Walkover / Did Not Fight</option>
                <option>Opponent Withdrawal</option>
                <option>Injury</option>
                <option>Disqualification</option>

            </select>

        </div>

        <div class="modal-buttons">

            <button class="save" onclick="confirmWinner()">
                CONFIRM WINNER
            </button>

            <button class="close" onclick="closeDirectWinner()">
                CANCEL
            </button>

        </div>

    </div>

</div>


<script>

let player1="HONG";
let player2="CHONG";

let score1=0;
let score2=0;

let gam1=0;
let gam2=0;

let rounds1=0;
let rounds2=0;

let currentRound=1;

let roundTime=60;
let timeLeft=60;

let bestOf=3;

let gamLimit=10;

let pointGap=12;
let pointGapEnabled=true;

let targetScore=20;
let targetScoreEnabled=true;

let scoreSize=80;

let timer=null;
let running=false;
let matchFinished=false;

let selectedWinner=null;
let audioContext=null;


/* AUDIO */

function startAudio(){

    if(!audioContext){
        audioContext=new(window.AudioContext||window.webkitAudioContext)();
    }

}

function beep(freq,duration,delay=0){

    startAudio();

    setTimeout(()=>{

        let osc=audioContext.createOscillator();
        let gain=audioContext.createGain();

        osc.frequency.value=freq;
        osc.type="sine";
        gain.gain.value=.15;

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime+duration);

    },delay);

}

function roundStartSound(){

    beep(700,.18,0);
    beep(1000,.25,220);

}

function winnerHorn(){

    beep(400,.25,0);
    beep(550,.25,300);
    beep(750,.45,600);

}


/* SCORE */

function changeScore(player,amount){

    if(matchFinished)return;

    if(player===1){
        score1+=amount;
        if(score1<0)score1=0;
    }else{
        score2+=amount;
        if(score2<0)score2=0;
    }

    updateDisplay();
    checkEarlyWinner();

}


/* GAM-JEOM */

function giveGamjeom(player){

    if(matchFinished)return;

    if(player===1){

        gam1++;
        score2++;

        if(gam1>=gamLimit){
            finishRound(2);
            return;
        }

    }else{

        gam2++;
        score1++;
        if(gam2>=gamLimit){
            finishRound(1);
            return;
        }

    }

    updateDisplay();
    checkEarlyWinner();

}


/* TIMER */

function startTimer(){

    if(matchFinished || running)return;

    startAudio();

    running=true;
    roundStartSound();

    clearInterval(timer);
    timer=setInterval(updateTimer,1000);

}

function pauseTimer(){

    running=false;
    clearInterval(timer);

}

function updateTimer(){

    if(timeLeft>0){

        timeLeft--;
        updateDisplay();

    }else{

        clearInterval(timer);
        running=false;
        endRound();

    }

}


/* EARLY ROUND WINNER */

function checkEarlyWinner(){

    if(matchFinished)return;

    let winner=null;

    if(pointGapEnabled){

        if(score1>score2 && score1-score2>=pointGap){
            winner=1;
        }

        if(score2>score1 && score2-score1>=pointGap){
            winner=2;
        }

    }

    if(!winner && targetScoreEnabled){

        if(score1>=targetScore){
            winner=1;
        }

        if(score2>=targetScore){
            winner=2;
        }

    }

    if(winner){
        finishRound(winner);
    }

}


/* END ROUND */

function endRound(){

    if(matchFinished)return;

    clearInterval(timer);
    running=false;

    if(score1>score2){
        finishRound(1);
    }
    else if(score2>score1){
        finishRound(2);
    }
    else{
        document.getElementById("winnerText").innerText=
        "Round tied — no round awarded.";
    }

}


/* FINISH ROUND */

function finishRound(winner){

    if(matchFinished)return;

    clearInterval(timer);
    running=false;

    if(winner===1){
        rounds1++;
    }else{
        rounds2++;
    }

    updateDisplay();

    /* CHECK MATCH WINNER FIRST */

    if(checkMatchWinner()){
        return;
    }

    /* ROUND WINNER POPUP */

    let winnerName=
        winner===1 ? player1 : player2;

    document.getElementById("roundWinnerName").innerText=
        winnerName;

    document.getElementById("roundWinnerReason").innerText=
        "Won Round "+currentRound;

    document.getElementById("roundWinnerOverlay").style.display=
        "flex";

}


/* NEXT ROUND */

function nextRound(){

    document.getElementById("roundWinnerOverlay").style.display=
        "none";

    currentRound++;

    score1=0;
    score2=0;

    gam1=0;
    gam2=0;

    timeLeft=roundTime;

    document.getElementById("winnerText").innerText="";

    updateDisplay();

}


/* MATCH WINNER */

function checkMatchWinner(){

    let needed=Math.ceil(bestOf/2);

    if(rounds1>=needed){

        showMatchWinner(player1,"Match Winner");
        return true;

    }

    if(rounds2>=needed){

        showMatchWinner(player2,"Match Winner");
        return true;

    }

    return false;

}

function showMatchWinner(name,reason){

    matchFinished=true;

    clearInterval(timer);
    running=false;

    document.getElementById("winnerName").innerText=name;

    document.getElementById("winnerReason").innerText=reason;

    document.getElementById("winnerOverlay").style.display="flex";

    document.getElementById("winnerText").innerText=
        "🏆 "+name+" WINS THE MATCH";

    winnerHorn();

}

function closeWinnerPopup(){

    document.getElementById("winnerOverlay").style.display="none";

}


/* DIRECT WINNER */

function openDirectWinner(){

    if(matchFinished)return;

    selectedWinner=null;

    document.getElementById("selectP1").classList.remove("selected");
    document.getElementById("selectP2").classList.remove("selected");

    document.getElementById("directWinnerModal").style.display="flex";

}

function selectWinner(player){

    selectedWinner=player;

    document.getElementById("selectP1").classList.remove("selected");
    document.getElementById("selectP2").classList.remove("selected");

    if(player===1){
        document.getElementById("selectP1").classList.add("selected");
    }else{
        document.getElementById("selectP2").classList.add("selected");
    }

}

function confirmWinner(){
    if(!selectedWinner){
        alert("Please select a winner.");
        return;
    }

    let reason=document.getElementById("directReason").value;

    let winnerName=
        selectedWinner===1 ? player1 : player2;

    closeDirectWinner();

    showMatchWinner(winnerName,reason);

}

function closeDirectWinner(){

    document.getElementById("directWinnerModal").style.display="none";

}


/* SETTINGS */

function openSettings(){

    document.getElementById("settingsPlayer1").value=player1;
    document.getElementById("settingsPlayer2").value=player2;
    document.getElementById("settingsRoundTime").value=roundTime;
    document.getElementById("settingsBestOf").value=bestOf;
    document.getElementById("settingsGamLimit").value=gamLimit;

    document.getElementById("settingsPointGap").value=pointGap;
    document.getElementById("settingsPointGapEnabled").checked=pointGapEnabled;

    document.getElementById("settingsTargetScore").value=targetScore;
    document.getElementById("settingsTargetScoreEnabled").checked=targetScoreEnabled;

    document.getElementById("settingsScoreSize").value=scoreSize;

    document.getElementById("settingsModal").style.display="flex";

}

function closeSettings(){

    document.getElementById("settingsModal").style.display="none";

}

function saveSettings(){

    player1=
        document.getElementById("settingsPlayer1").value.trim()||"HONG";

    player2=
        document.getElementById("settingsPlayer2").value.trim()||"CHONG";

    roundTime=
        parseInt(document.getElementById("settingsRoundTime").value)||60;

    bestOf=
        parseInt(document.getElementById("settingsBestOf").value)||3;

    gamLimit=
        parseInt(document.getElementById("settingsGamLimit").value)||10;

    pointGap=
        parseInt(document.getElementById("settingsPointGap").value)||12;

    pointGapEnabled=
        document.getElementById("settingsPointGapEnabled").checked;

    targetScore=
        parseInt(document.getElementById("settingsTargetScore").value)||20;

    targetScoreEnabled=
        document.getElementById("settingsTargetScoreEnabled").checked;

    scoreSize=
        parseInt(document.getElementById("settingsScoreSize").value)||80;

    timeLeft=roundTime;

    updateDisplay();
    closeSettings();

}


/* NEW MATCH */

function newMatch(){

    clearInterval(timer);

    running=false;
    matchFinished=false;

    score1=0;
    score2=0;

    gam1=0;
    gam2=0;

    rounds1=0;
    rounds2=0;

    currentRound=1;

    timeLeft=roundTime;

    document.getElementById("winnerText").innerText="";

    document.getElementById("winnerOverlay").style.display="none";
    document.getElementById("roundWinnerOverlay").style.display="none";

    updateDisplay();

}


/* DISPLAY */

function updateDisplay(){

    document.getElementById("player1Name").innerText=player1;
    document.getElementById("player2Name").innerText=player2;

    document.getElementById("score1").innerText=score1;
    document.getElementById("score2").innerText=score2;

    document.getElementById("gam1").innerText=gam1;
    document.getElementById("gam2").innerText=gam2;

    document.getElementById("rounds1").innerText=rounds1;
    document.getElementById("rounds2").innerText=rounds2;

    document.getElementById("roundDisplay").innerText=
        "ROUND "+currentRound;

    let minutes=Math.floor(timeLeft/60);
    let seconds=timeLeft%60;

    document.getElementById("timer").innerText=
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0");

    document.getElementById("score1").style.fontSize=
        scoreSize+"px";

    document.getElementById("score2").style.fontSize=
        scoreSize+"px";

}

updateDisplay();

</script>

</body>
</html>
