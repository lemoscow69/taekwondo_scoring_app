<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taekwondo Scoreboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131a;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 12px;font-weight:bold;color:white;background:#394150}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#080a0f;gap:10px}
header h1{font-size:clamp(16px,2.5vw,26px);margin:0}
.small-btn{font-size:13px;padding:9px}
.board{display:grid;grid-template-columns:1fr minmax(150px,25%) 1fr;min-height:calc(100vh - 58px);gap:8px;padding:8px}
.fighter{border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;min-width:0}
.red{background:linear-gradient(160deg,#b71c1c,#ef5350)}
.blue{background:linear-gradient(160deg,#0d47a1,#2196f3)}
.fighter-name{width:100%;font-weight:bold;font-size:clamp(18px,3vw,30px);text-align:center;background:#0003;color:white;border:1px solid #ffffff55;border-radius:8px;padding:8px}
.score{font-size:clamp(80px,17vw,180px);font-weight:900;line-height:1.1;text-shadow:0 4px 8px #0005}
.score.flash{animation:flash .3s ease}
@keyframes flash{50%{transform:scale(1.12);color:#ffd54f}}
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:8px 0}
.points button{background:#111a;font-size:clamp(12px,1.5vw,17px);padding:14px 4px;min-height:55px}
.points button span{display:block;font-size:22px;margin-top:4px}
.gam-box{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0;width:100%}
.gam-box button{font-size:23px;min-width:48px;min-height:48px;background:#111a}
.gam-count{font-size:25px;font-weight:900;min-width:30px;text-align:center}
.gam-label{font-size:13px;font-weight:bold}
.total-gam{font-size:12px;background:#0003;padding:5px 9px;border-radius:6px}
.round-wins{font-size:14px;text-align:center;color:#ddd}
.center{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:#1b202a;border-radius:14px;padding:12px 8px}
.round-label{font-size:17px;font-weight:bold;color:#ffd54f;text-align:center}
.timer{font-size:clamp(38px,7vw,75px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-adjust{display:flex;gap:8px}
.timer-adjust button{font-size:14px}
.center-actions{width:100%;display:grid;grid-template-columns:1fr;gap:7px}
.center-actions button{min-height:43px}
.start{background:#2e7d32}.pause{background:#ef6c00}.end{background:#b71c1c}
.direct{background:#6a1b9a}.undo{background:#455a64}.new{background:#37474f}
.break-box{width:100%;text-align:center;border:1px solid #ffffff22;border-radius:10px;padding:9px}
.break-clock{font-size:28px;font-weight:bold;color:#ffd54f}
.hidden{display:none!important}
.status{font-size:12px;color:#cfd8dc;text-align:center;line-height:1.4}
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#202631;border:1px solid #ffffff33;border-radius:16px;padding:22px;text-align:center}
.modal h2{font-size:clamp(25px,5vw,40px);margin:8px 0 14px}
.modal p{line-height:1.5}
.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.settings{text-align:left}
.settings h2{text-align:center}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;font-size:14px}
.settings input,.settings select{width:130px;max-width:50%;padding:8px;border-radius:6px;border:1px solid #777;background:#111821;color:white}
.settings input[type=checkbox]{width:22px}
@media(max-width:650px){
header{padding:8px}
.board{grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.center{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.center .round-label,.center .timer,.center .timer-adjust,.center .status{grid-column:1/-1}
.center-actions{grid-template-columns:repeat(2,1fr)}
.fighter{padding:8px 5px}
.score{font-size:clamp(70px,19vw,120px)}
.points button{padding:10px 2px;min-height:48px}
.gam-box{gap:5px}
.gam-box button{min-width:38px;min-height:42px}
}
</style>
</head>
<body>
<header>
  <h1>🥋 TAEKWONDO SCOREBOARD</h1>
  <button class="small-btn" id="settingsBtn">⚙ SETTINGS</button>
</header>

<main class="board">
  <section class="fighter red">
    <input class="fighter-name" id="redName" value="HONG" aria-label="Red fighter name">
    <div class="score" id="redScore">0</div>
    <div class="points">
      <button data-side="red" data-type="punch">PUNCH<span id="redPunchLabel">1</span></button>
      <button data-side="red" data-type="body">BODY<span id="redBodyLabel">2</span></button>
      <button data-side="red" data-type="head">HEAD<span id="redHeadLabel">3</span></button>
    </div>
    <div class="gam-label">GAM-JEOM — THIS ROUND</div>
    <div class="gam-box">
      <button data-gam-side="red" data-delta="-1">−</button>
      <div class="gam-count" id="redGam">0</div>
      <button data-gam-side="red" data-delta="1">+</button>
    </div>
    <div class="total-gam">Match total: <b id="redTotalGam">0</b></div>
    <div class="round-wins">Rounds won: <b id="redWins">0</b></div>
  </section>

  <section class="center">
    <div class="round-label" id="roundLabel">ROUND 1</div>
    <div class="timer" id="timer">02:00</div>
    <div class="timer-adjust">
      <button id="minusFive">−5 SEC</button>
      <button id="plusFive">+5 SEC</button>
    </div>

    <div class="break-box hidden" id="breakBox">
      <div>BREAK TIME</div>
      <div class="break-clock" id="breakClock">00:30</div>
      <button id="startNextBtn">START NEXT ROUND</button>
    </div>

    <div class="center-actions">
      <button class="start" id="startBtn">▶ START</button>
      <button class="pause" id="pauseBtn">Ⅱ PAUSE</button>
      <button class="end" id="endBtn">■ END ROUND</button>
      <button class="undo" id="undoBtn">↶ UNDO LAST</button>
      <button class="direct" id="directBtn">🏆 DIRECT WINNER</button>
      <button class="new" id="newBtn">↻ NEW MATCH</button>
    </div>
    <div class="status" id="status">Ready to start</div>
  </section>

  <section class="fighter blue">
    <input class="fighter-name" id="blueName" value="CHONG" aria-label="Blue fighter name">
    <div class="score" id="blueScore">0</div>
    <div class="points">
      <button data-side="blue" data-type="punch">PUNCH<span id="bluePunchLabel">1</span></button>
      <button data-side="blue" data-type="body">BODY<span id="blueBodyLabel">2</span></button>
      <button data-side="blue" data-type="head">HEAD<span id="blueHeadLabel">3</span></button>
    </div>
    <div class="gam-label">GAM-JEOM — THIS ROUND</div>
    <div class="gam-box">
      <button data-gam-side="blue" data-delta="-1">−</button>
      <div class="gam-count" id="blueGam">0</div>
      <button data-gam-side="blue" data-delta="1">+</button>
    </div>
    <div class="total-gam">Match total: <b id="blueTotalGam">0</b></div>
    <div class="round-wins">Rounds won: <b id="blueWins">0</b></div>
  </section>
</main>

<div class="overlay hidden" id="winnerOverlay">
  <div class="modal">
    <h2 id="winnerTitle">ROUND WINNER</h2>
    <p id="winnerText"></p>
    <div class="modal-actions">
      <button class="start" id="winnerNextBtn">NEXT ROUND</button>
      <button id="directRedBtn" class="hidden">RED WINS</button>
      <button id="directBlueBtn" class="hidden">BLUE WINS</button>
      <button id="winnerCloseBtn">CLOSE</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="settingsOverlay">
  <div class="modal settings">
    <h2>MATCH SETTINGS</h2>
    <label>Round time (seconds)<input id="setRoundTime" type="number" min="10" value="120"></label>
    <label>Break time (seconds)<input id="setBreakTime" type="number" min="0" value="30"></label>
    <label>Match format
      <select id="setFormat">
        <option value="1">Best of 1</option>
        <option value="3" selected>Best of 3</option>
        <option value="5">Best of 5</option>
      </select>
    </label>
    <label>Punch points<input id="setPunch" type="number" min="0" value="1"></label>
    <label>Body points<input id="setBody" type="number" min="0" value="2"></label>
    <label>Head points<input id="setHead" type="number" min="0" value="3"></label>
    <label>Point gap (0 = off)<input id="setGap" type="number" min="0" value="12"></label>
    <label>Target score (0 = off)<input id="setTarget" type="number" min="0" value="0"></label>
    <label>Gam-jeom limit for match loss<input id="setGamLimit" type="number" min="1" value="10"></label>
    <label>Round win by 5 Gam-jeom (Best of 3)<input id="setRoundGam" type="checkbox" checked></label>
    <label>Auto-start next round after break<input id="setAutoNext" type="checkbox"></label>
    <label>Sound effects<input id="setSound" type="checkbox" checked></label>
    <label>Score size
      <select id="setScoreSize">
        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>
      </select>
    </label>
    <div class="modal-actions">
      <button class="start" id="saveSettingsBtn">SAVE SETTINGS</button>
      <button id="cancelSettingsBtn">CANCEL</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let cfg={
  roundTime:120,breakTime:30,format:3,
  punch:1,body:2,head:3,gap:12,target:0,
  gamLimit:10,roundGam:true,autoNext:false,
  sound:true,scoreSize:"medium"
};

function freshFighters(){
  return {
    red:{score:0,gam:0,totalGam:0,wins:0},
    blue:{score:0,gam:0,totalGam:0,wins:0}
  };
}
let fighters=freshFighters();
let round=1,seconds=cfg.roundTime,breakSeconds=cfg.breakTime;
let timerId=null,breakId=null,running=false,inBreak=false,matchOver=false;
let history=[],pendingAction="none",directMode=false,audioContext=null;

function fighterName(side){
  return $(side+"Name").value.trim()||(side==="red"?"HONG":"CHONG");
}
function opponent(side){return side==="red"?"blue":"red";}
function requiredWins(){return Math.ceil(cfg.format/2);}
function fmt(s){
  s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+
         String(s%60).padStart(2,"0");
}
function setStatus(t){$("status").textContent=t;}

function snapshot(){
  history.push(JSON.stringify({
    fighters,round,seconds,breakSeconds,inBreak,matchOver
  }));
  if(history.length>100)history.shift();
}
function stopClocks(){
  clearInterval(timerId);clearInterval(breakId);
  timerId=null;breakId=null;running=false;
}
function render(){
  for(const s of ["red","blue"]){
    $(s+"Score").textContent=fighters[s].score;
    $(s+"Gam").textContent=fighters[s].gam;
    $(s+"TotalGam").textContent=fighters[s].totalGam;
    $(s+"Wins").textContent=fighters[s].wins;
  }
  $("roundLabel").textContent="ROUND "+round;
  $("timer").textContent=fmt(seconds);
  $("breakClock").textContent=fmt(breakSeconds);
  for(const s of ["red","blue"]){
    $(s+"PunchLabel").textContent=cfg.punch;
    $(s+"BodyLabel").textContent=cfg.body;
    $(s+"HeadLabel").textContent=cfg.head;
  }
  $("breakBox").classList.toggle("hidden",!inBreak);
  document.querySelectorAll(".score").forEach(el=>{
    el.style.fontSize=cfg.scoreSize==="small"?"clamp(60px,12vw,120px)":
      cfg.scoreSize==="large"?"clamp(90px,20vw,200px)":"clamp(80px,17vw,180px)";
  });
  const locked=matchOver||inBreak;
  document.querySelectorAll(".points button,.gam-box button").forEach(b=>b.disabled=locked);
  $("startBtn").disabled=matchOver||inBreak||running;
  $("pauseBtn").disabled=!running;
  $("endBtn").disabled=matchOver||inBreak;
  $("startNextBtn").disabled=matchOver||!inBreak;
}
function flash(side){
  const el=$(side+"Score");
  el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
}
function sound(type){
  if(!cfg.sound)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioContext)audioContext=new AC();
    if(audioContext.state==="suspended")audioContext.resume();
    const now=audioContext.currentTime;
    const notes={score:[700,.12],gam:[360,.18],round:[520,.25],horn:[850,.5],undo:[440,.1]};
    const [freq,duration]=notes[type]||notes.score;
    const osc=audioContext.createOscillator(),gain=audioContext.createGain();
    osc.type=type==="horn"?"sawtooth":"sine";
    osc.frequency.setValueAtTime(freq,now);
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.18,now+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
    osc.connect(gain);gain.connect(audioContext.destination);
    osc.start(now);osc.stop(now+duration+.02);
  }catch(e){}
}
function addPoints(side,type){
  if(matchOver||inBreak)return;
  snapshot();
  fighters[side].score+=cfg[type];
  flash(side);sound("score");render();
  checkScoreRoundEnd();
}
function changeGam(side,delta){
  if(matchOver||inBreak)return;
  const f=fighters[side],opp=fighters[opponent(side)];
  if(delta<0&&(f.gam<=0||f.totalGam<=0||opp.score<=0))return;

  snapshot();
  if(delta>0){
    f.gam++;f.totalGam++;
    opp.score+=1;
    sound("gam");
    setStatus(fighterName(side)+" received Gam-jeom: opponent gets 1 point.");
  }else{
    f.gam--;f.totalGam--;
    opp.score=Math.max(0,opp.score-1);
    sound("undo");
    setStatus("Gam-jeom corrected.");
  }
  render();

  if(delta>0&&f.totalGam>=cfg.gamLimit){
    declareMatchWinner(opponent(side),
      fighterName(side)+" reached "+cfg.gamLimit+" total Gam-jeom.");
    return;
  }
  if(delta>0&&cfg.roundGam&&cfg.format===3&&f.gam>=5){
    awardRound(opponent(side),
      fighterName(side)+" received 5 Gam-jeom in this round.");
    return;
  }
  checkScoreRoundEnd();
}
function checkScoreRoundEnd(){
  if(matchOver||inBreak)return;
  const r=fighters.red.score,b=fighters.blue.score;
  if(cfg.target>0&&(r>=cfg.target||b>=cfg.target)){
    if(r!==b)awardRound(r>b?"red":"blue","Target score reached.");
    return;
  }
  if(cfg.gap>0&&Math.abs(r-b)>=cfg.gap){
    awardRound(r>b?"red":"blue","Point gap reached.");
  }
}

function startTimer(){
  if(matchOver||inBreak||running)return;
  if(seconds<=0){endRound();return;}
  try{
    if(!audioContext){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC)audioContext=new AC();
    }
    if(audioContext&&audioContext.state==="suspended")audioContext.resume();
  }catch(e){}
  running=true;setStatus("Round in progress");render();
  timerId=setInterval(()=>{
    seconds--;
    if(seconds<=0){seconds=0;render();endRound();return;}
    render();
  },1000);
}
function pauseTimer(){
  if(!running)return;
  clearInterval(timerId);timerId=null;running=false;
  setStatus("Paused");render();
}
function adjustTimer(delta){
  if(matchOver||inBreak)return;
  seconds=Math.max(0,seconds+delta);render();
}

function endRound(){
  if(matchOver||inBreak)return;
  stopClocks();
  const r=fighters.red.score,b=fighters.blue.score;
  if(r===b){
    showWinner("ROUND DRAW","Round "+round+" ended in a draw.","next");
  }else{
    awardRound(r>b?"red":"blue","Round ended.");
  }
}

function awardRound(side,reason){
  if(matchOver||inBreak)return;
  stopClocks();
  snapshot();
  if(side)fighters[side].wins++;
  render();sound("round");

  if(side&&fighters[side].wins>=requiredWins()){
    declareMatchWinner(side,"Required rounds won.");
    return;
  }
  if(!side){
    showWinner("ROUND DRAW",reason,"next");
    return;
  }
  showWinner("ROUND WINNER",
    fighterName(side)+" wins Round "+round+".<br>"+reason,"next");
}

function declareMatchWinner(side,reason){
  stopClocks();matchOver=true;inBreak=false;
  render();sound("horn");
  showWinner("MATCH WINNER",
    "🏆 "+fighterName(side)+" WINS THE MATCH!<br>"+reason,"close");
}

function showWinner(title,message,action){
  pendingAction=action;
  directMode=false;
  $("winnerTitle").textContent=title;
  $("winnerText").innerHTML=message;
  $("winnerNextBtn").classList.toggle("hidden",action!=="next");
  $("directRedBtn").classList.add("hidden");
  $("directBlueBtn").classList.add("hidden");
  $("winnerCloseBtn").classList.remove("hidden");
  $("winnerOverlay").classList.remove("hidden");
}

function closeWinner(){
  $("winnerOverlay").classList.add("hidden");
  directMode=false;
  $("winnerNextBtn").classList.remove("hidden");
  $("directRedBtn").classList.add("hidden");
  $("directBlueBtn").classList.add("hidden");
}

function winnerContinue(){
  // Fixed handler: always progresses to the break/next-round flow.
  if(pendingAction!=="next"||matchOver)return;
  closeWinner();
  beginBreak();
}

function beginBreak(){
  if(matchOver)return;
  stopClocks();
  inBreak=true;
  breakSeconds=cfg.breakTime;
  seconds=0;
  render();

  if(cfg.breakTime<=0){
    if(cfg.autoNext)startNextRound();
    else setStatus("Break finished — press START NEXT ROUND.");
    return;
  }

  setStatus("Break in progress");
  breakId=setInterval(()=>{
    if(!inBreak||matchOver){
      clearInterval(breakId);breakId=null;return;
    }
    breakSeconds--;
    render();
    if(breakSeconds<=0){
      clearInterval(breakId);breakId=null;
      breakSeconds=0;render();
      if(cfg.autoNext)startNextRound();
      else setStatus("Break finished — press START NEXT ROUND.");
    }
  },1000);
}

function startNextRound(){
  if(matchOver||!inBreak)return;
  // Stop the break interval before changing state.
  clearInterval(breakId);breakId=null;
  clearInterval(timerId);timerId=null;
  running=false;inBreak=false;
  round++;
  for(const s of ["red","blue"]){
    fighters[s].score=0;
    fighters[s].gam=0;
    // totalGam and wins intentionally carry over to the next round.
  }
  seconds=cfg.roundTime;
  breakSeconds=cfg.breakTime;
  render();
  setStatus("Round "+round+" ready — press START.");
  if(cfg.autoNext)startTimer();
}

function openDirectWinner(){
  if(matchOver)return;
  stopClocks();
  pendingAction="direct";
  directMode=true;
  $("winnerTitle").textContent="DECLARE MATCH WINNER";
  $("winnerText").textContent="Choose the winner of this match.";
  $("winnerNextBtn").classList.add("hidden");
  $("directRedBtn").classList.remove("hidden");
  $("directBlueBtn").classList.remove("hidden");
  $("winnerCloseBtn").classList.remove("hidden");
  $("winnerOverlay").classList.remove("hidden");
}

function newMatch(){
  if(!confirm("Start a new match? Current scores will be cleared."))return;
  stopClocks();
  fighters=freshFighters();
  round=1;seconds=cfg.roundTime;breakSeconds=cfg.breakTime;
  inBreak=false;matchOver=false;history=[];
  pendingAction="none";directMode=false;
  closeWinner();
  $("settingsOverlay").classList.add("hidden");
  render();setStatus("New match ready.");
}

function openSettings(){
  $("setRoundTime").value=cfg.roundTime;
  $("setBreakTime").value=cfg.breakTime;
  $("setFormat").value=cfg.format;
  $("setPunch").value=cfg.punch;
  $("setBody").value=cfg.body;
  $("setHead").value=cfg.head;
  $("setGap").value=cfg.gap;
  $("setTarget").value=cfg.target;
  $("setGamLimit").value=cfg.gamLimit;
  $("setRoundGam").checked=cfg.roundGam;
  $("setAutoNext").checked=cfg.autoNext;
  $("setSound").checked=cfg.sound;
  $("setScoreSize").value=cfg.scoreSize;
  $("settingsOverlay").classList.remove("hidden");
}
function closeSettings(){$("settingsOverlay").classList.add("hidden");}
function saveSettings(){
  const num=(id,min,def)=>Math.max(min,Number($(id).value)||def);
  cfg.roundTime=num("setRoundTime",10,120);
  cfg.breakTime=num("setBreakTime",0,30);
  cfg.format=Number($("setFormat").value);
  cfg.punch=num("setPunch",0,1);
  cfg.body=num("setBody",0,2);
  cfg.head=num("setHead",0,3);
  cfg.gap=num("setGap",0,0);
  cfg.target=num("setTarget",0,0);
  cfg.gamLimit=num("setGamLimit",1,10);
  cfg.roundGam=$("setRoundGam").checked;
  cfg.autoNext=$("setAutoNext").checked;
  cfg.sound=$("setSound").checked;
  cfg.scoreSize=$("setScoreSize").value;
  if(!running&&!inBreak)seconds=cfg.roundTime;
  closeSettings();render();setStatus("Settings saved.");
}

function undoLast(){
  if(!history.length){setStatus("Nothing to undo.");return;}
  stopClocks();
  const old=JSON.parse(history.pop());
  fighters=old.fighters;
  round=old.round;
  seconds=old.seconds;
  breakSeconds=old.breakSeconds;
  inBreak=old.inBreak;
  matchOver=old.matchOver;
  closeWinner();render();sound("undo");
  setStatus("Last action undone.");
}

/* Event handlers are assigned once and never overwritten by popups. */
document.querySelectorAll("[data-side][data-type]").forEach(btn=>{
  btn.addEventListener("click",()=>addPoints(btn.dataset.side,btn.dataset.type));
});
document.querySelectorAll("[data-gam-side]").forEach(btn=>{
  btn.addEventListener("click",()=>changeGam(btn.dataset.gamSide,Number(btn.dataset.delta)));
});

$("settingsBtn").addEventListener("click",openSettings);
$("startBtn").addEventListener("click",startTimer);
$("pauseBtn").addEventListener("click",pauseTimer);
$("endBtn").addEventListener("click",endRound);
$("undoBtn").addEventListener("click",undoLast);
$("newBtn").addEventListener("click",newMatch);
$("directBtn").addEventListener("click",openDirectWinner);
$("minusFive").addEventListener("click",()=>adjustTimer(-5));
