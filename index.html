<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Vikas</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white;
      background: #0b1020;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: clamp(32px, 6vw, 64px); }

    .ticker {
      width: 100%;
      overflow: hidden;
      padding: 24px 0;
      border-block: 1px solid #ffffff33;
      background: #ffffff0d;
    }

    .track {
      display: flex;
      width: max-content;
      animation: scroll 18s linear infinite;
    }

    .message {
      padding-right: 40px;
      white-space: nowrap;
      font-size: clamp(24px, 5vw, 48px);
      font-weight: bold;
    }

    a { color: white; text-decoration: none; }
    a:hover { color: #a5b4fc; }

    @keyframes scroll {
      to { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Contact Vikas</h1>

    <div class="ticker">
      <div class="track">
        <div class="message">
          CONTACT TO VIIKAS ✦
          <a href="tel:8687363653">MOB 8687363653</a> ✦
        </div>
        <div class="message" aria-hidden="true">
          CONTACT TO VIIKAS ✦
          <a href="tel:8687363653">MOB 8687363653</a> ✦
        </div>
      </div>
    </div>
  </main>
</body>
</html>
