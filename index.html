<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Taekwondo Scoreboard</title>


<style>

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  overscroll-behavior:none;
}

body{
  background:#10131a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:manipulation;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:10px 12px;
  font-weight:bold;
  color:white;
  background:#394150;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97)
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}


header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  background:#080a0f;
  gap:10px;
  flex-wrap:wrap
}

header h1{
  font-size:clamp(16px,2.5vw,26px);
  margin:0
}

.header-right{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap
}

.small-btn{
  font-size:13px;
  padding:9px
}

.room-badge{
  font-size:11px;
  font-weight:bold;
  background:#263238;
  color:#ffd54f;
  padding:7px 9px;
  border-radius:7px
}


/* =========================================================
   REFEREE MOBILE SCREEN
   ========================================================= */

.referee-screen{
  width:100%;
  min-height:100dvh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#10131a;
}

.referee-top{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  background:#080a0f;
  border-bottom:1px solid #303642;
  z-index:5;
}

.referee-title{
  font-size:18px;
  font-weight:900;
  letter-spacing:.5px;
}

.referee-room{
  font-size:12px;
  color:#ffd54f;
  font-weight:800;
}

.referee-board{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(3,1fr);
  width:100%;
  overflow:hidden;
}

.referee-row{
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  border-bottom:2px solid #fff;
}

.referee-row:last-child{
  border-bottom:0;
}

.referee-cell{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px;
}

.referee-cell.red{
  background:#b40000;
  border-right:2px solid #fff;
}

.referee-cell.blue{
  background:#004ea8;
}

.ref-score-btn{
  width:100%;
  height:100%;
  min-height:0;
  border-radius:0;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-weight:900;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  touch-action:manipulation;
}

.ref-score-btn:hover{
  background:rgba(255,255,255,.08);
}

.ref-score-btn:active{
  transform:none;
  background:rgba(255,255,255,.18);
}

.ref-score-label{
  font-size:clamp(15px,4vw,28px);
  font-weight:900;
  line-height:1;
}

.ref-score-value{
  font-size:clamp(42px,14vw,110px);
  font-weight:1000;
  line-height:.9;
}

.referee-bottom{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:5px;
  background:#080a0f;
  color:#9aa4b2;
  font-size:11px;
  font-weight:700;
}


/* =========================================================
   ORIGINAL SCOREBOARD
   ========================================================= */

.scoreboard{
  display:grid;
  grid-template-columns:1fr 300px 1fr;
  gap:10px;
  padding:12px;
}

.side{
  min-width:0;
}

.red-side{
  background:#b71c1c;
}

.blue-side{
  background:#0d47a1;
}

.score{
  font-size:clamp(80px,17vw,180px);
  line-height:.9;
  font-weight:900;
}

.points{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.points button{
  min-height:52px;
}

.gam-box{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}


/* =========================================================
   GENERAL
   ========================================================= */

.hidden{
  display:none !important;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#171c25;
  border:1px solid #394150;
  border-radius:14px;
  padding:18px;
}

input,
select{
  background:#0e1117;
  color:#fff;
  border:1px solid #394150;
  border-radius:8px;
  padding:9px 10px;
}

@media(max-width:700px){

  .scoreboard{
    grid-template-columns:1fr;
  }

}


/* =========================================================
   MOBILE REFEREE — EXACT VERTICAL TOUCH LAYOUT
   ========================================================= */

@media(max-width:700px){

  body.referee-mode{
    overflow:hidden;
  }

  body.referee-mode header,
  body.referee-mode .main-board,
  body.referee-mode .scoreboard{
    display:none !important;
  }

  body.referee-mode .referee-screen{
    display:flex;
  }

}


/* =========================================================
   DESKTOP: REFEREE SCREEN HIDDEN
   ========================================================= */

@media(min-width:701px){

  .referee-screen{
    display:none !important;
  }

}

</style>

</head>


<body>


<!-- ========================================================
     REFEREE MOBILE VIEW
     ======================================================== -->

<div
  id="refereeScreen"
  class="referee-screen hidden"
>

  <div class="referee-top">

    <div class="referee-title">
      TAEKWONDO REFEREE
    </div>

    <div
      id="refereeRoom"
      class="referee-room"
    >
      ROOM ------
    </div>

  </div>


  <div class="referee-board">


    <!-- =========================
         +3
         ========================= -->

    <div class="referee-row">

      <div class="referee-cell red">

        <button
          id="refRedHead"
          class="ref-score-btn"
          data-ref-side="red"
          data-ref-points-type="head"
          type="button"
        >

          <span class="ref-score-label">
            RED
          </span>

          <span
            id="refRedHeadValue"
            class="ref-score-value"
          >
            +3
          </span>

        </button>

      </div>


      <div class="referee-cell blue">

        <button
          id="refBlueHead"
          class="ref-score-btn"
          data-ref-side="blue"
          data-ref-points-type="head"
          type="button"
        >

          <span class="ref-score-label">
            BLUE
          </span>

          <span
            id="refBlueHeadValue"
            class="ref-score-value"
          >
            +3
          </span>

        </button>

      </div>

    </div>


    <!-- =========================
         +2
         ========================= -->

    <div class="referee-row">

      <div class="referee-cell red">

        <button
          id="refRedBody"
          class="ref-score-btn"
          data-ref-side="red"
          data-ref-points-type="body"
          type="button"
        >

          <span class="ref-score-label">
            RED
          </span>

          <span
            id="refRedBodyValue"
            class="ref-score-value"
          >
            +2
          </span>

        </button>

      </div>


      <div class="referee-cell blue">

        <button
          id="refBlueBody"
          class="ref-score-btn"
          data-ref-side="blue"
          data-ref-points-type="body"
          type="button"
        >

          <span class="ref-score-label">
            BLUE
          </span>

          <span
            id="refBlueBodyValue"
            class="ref-score-value"
          >
            +2
          </span>

        </button>

      </div>

    </div>


    <!-- =========================
         +1
         ========================= -->

    <div class="referee-row">

      <div class="referee-cell red">

        <button
          id="refRedPunch"
          class="ref-score-btn"
          data-ref-side="red"
          data-ref-points-type="punch"
          type="button"
        >

          <span class="ref-score-label">
            RED
          </span>

          <span
            id="refRedPunchValue"
            class="ref-score-value"
          >
            +1
          </span>

        </button>

      </div>


      <div class="referee-cell blue">

        <button
          id="refBluePunch"
          class="ref-score-btn"
          data-ref-side="blue"
          data-ref-points-type="punch"
          type="button"
        >

          <span class="ref-score-label">
            BLUE
          </span>

          <span
            id="refBluePunchValue"
            class="ref-score-value"
          >
            +1
          </span>

        </button>

      </div>

    </div>


  </div>


  <div
    id="refereeStatus"
    class="referee-bottom"
  >
    CONNECTING...
  </div>

</div>


<!-- ========================================================
     ORIGINAL APPLICATION STARTS
     ======================================================== -->

<header>

  <h1>
    Taekwondo Scoreboard
  </h1>

  <div class="header-right">

    <div
      id="roomBadge"
      class="room-badge"
    >
      ROOM ------
    </div>

    <button
      id="settingsBtn"
      class="small-btn"
      type="button"
    >
      SETTINGS
    </button>

  </div>

</header>


<!-- ORIGINAL SCOREBOARD CONTENT -->

<main
  id="mainBoard"
  class="scoreboard"
>

  <!-- RED SIDE -->

  <section class="side red-side">

    <!-- original red scoreboard content -->

  </section>


  <!-- CENTER -->

  <section>

    <!-- original timer / round / controls -->

  </section>


  <!-- BLUE SIDE -->

  <section class="side blue-side">

    <!-- original blue scoreboard content -->

  </section>

</main>


<script>

/* =========================================================
   BASIC HELPERS
   ========================================================= */

function $(id){
  return document.getElementById(id);
}


/* =========================================================
   REFEREE MODE DETECTION
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const isRefereeMode =
  params.get("referee") === "1" ||
  params.get("mode") === "referee";


/* =========================================================
   REFEREE ROOM
   ========================================================= */

let refereeRoom =
  String(
    params.get("room") || ""
  )
  .toUpperCase()
  .replace(/[^A-Z0-9]/g,"")
  .slice(0,12);


/* =========================================================
   REFEREE NUMBER
   ========================================================= */

let refNumber =
  Number(
    params.get("ref")
  ) || 1;


/* =========================================================
   REFEREE UI
   ========================================================= */

function showRefereeUI(){

  if(!isRefereeMode){
    return;
  }

  document.body.classList.add(
    "referee-mode"
  );

  $("refereeScreen")
    .classList.remove("hidden");

  if($("refereeRoom")){

    $("refereeRoom")
      .textContent =
        "ROOM "+
        (
          refereeRoom ||
          "------"
        );

  }

}


/* =========================================================
   REFEREE BUTTON TOUCH
   ========================================================= */

document
  .querySelectorAll(".ref-score-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        if(
          typeof sendRefereeVote ===
          "function"
        ){

          sendRefereeVote(
            this.dataset.refSide,
            this.dataset.refPointsType
          );

        }

      },
      {
        passive:false
      }
    );

  });


/* =========================================================
   NO BROWSER DOUBLE-TAP ZOOM
   ========================================================= */

document.addEventListener(
  "dblclick",
  event=>{

    if(
      event.target.closest(
        ".ref-score-btn"
      )
    ){

      event.preventDefault();

    }

  },
  {
    passive:false
  }
);


/* =========================================================
   START REFEREE UI
   ========================================================= */

showRefereeUI();


/*
   =========================================================
   ORIGINAL JAVASCRIPT CONTINUES HERE
   =========================================================

   Firebase
   settings
   scoring
   timer
   rounds
   break
   Gam-jeom
   TV display
   QR
   history / undo
   remote referee voting
   winner logic
   etc.

   These existing sections are kept unchanged
   in the master source.
   =========================================================
*/


</script>

</body>

</html>
