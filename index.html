<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Taekwondo Scoring</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#10131a;
  color:#fff;
  text-align:center;
}

header{
  padding:18px 10px;
  font-size:30px;
  font-weight:bold;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:17px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.start{background:#168cff}
.pause{background:#6757e8}
.end{background:#ed3948}
.direct{background:#ed3948}
.new{background:#16bfa5}
.settingsBtn{background:#333}

.timer{
  font-size:55px;
  font-weight:bold;
  margin-top:10px;
}

.roundInfo{
  font-size:24px;
  margin:8px;
}

.match{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

.player{
  padding:20px;
  border-radius:20px;
}

.red{background:#a52d45}
.blue{background:#176c7c}

.name{
  font-size:30px;
  font-weight:bold;
  margin-bottom:10px;
}

.score{
  font-size:90px;
  font-weight:bold;
}

.scoreButtons{
  display:flex;
  justify-content:center;
  gap:15px;
}

.scoreButtons button{
  width:90px;
  font-size:36px;
  background:#16bfa5;
}

.scoreButtons button:first-child{
  background:#555;
}

.gam{
  font-size:20px;
  margin-top:12px;
}

.gam button{
  background:#555;
  margin-top:7px;
  font-size:15px;
}

.rounds{
  margin-top:12px;
  font-size:18px;
}

#winnerText{
  min-height:35px;
  font-size:25px;
  font-weight:bold;
  margin:15px;
}

/* POPUP */

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:9999;
  justify-content:center;
  align-items:center;
}

.popupBox{
  width:min(90%,650px);
  background:#202733;
  border:4px solid #ffd700;
  border-radius:25px;
  padding:45px 25px;
  box-shadow:0 0 45px rgba(255,215,0,.5);
  animation:pop .35s ease;
}

.popupTitle{
  color:#ffd700;
  font-size:30px;
  font-weight:bold;
}

.popupName{
  font-size:65px;
  font-weight:bold;
  margin:20px 0;
}

.popupReason{
  font-size:20px;
  color:#ddd;
}

.popupClose{
  background:#16bfa5;
  margin-top:25px;
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:5000;
  justify-content:center;
  align-items:center;
}

.modalBox{
  width:min(90%,430px);
  background:#202733;
  border-radius:20px;
  padding:25px;
}

.modalBox h2{
  margin-top:0;
}

.modalBox label{
  display:block;
  text-align:left;
  margin-top:12px;
}

.modalBox input,
.modalBox select{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

.modalBox button{
  margin-top:15px;
}

.save{background:#16bfa5}
.close{background:#555}

.reasonBtn{
  display:block;
  width:100%;
  background:#444;
  margin:8px 0!important;
}

@media(max-width:700px){
  .match{grid-template-columns:1fr}
  .timer{font-size:45px}
  .score{font-size:75px}
  .name{font-size:25px}
  .popupName{font-size:45px}
}
</style>
</head>

<body>

<header>🥋 TAEKWONDO SCORING</header>

<div class="topbar">
  <button class="start" onclick="startTimer()">START</button>
  <button class="pause" onclick="pauseTimer()">PAUSE</button>
  <button class="end" onclick="endRound()">END ROUND</button>
  <button class="direct" onclick="openDirectWinner()">DIRECT WINNER</button>
  <button class="new" onclick="newMatch()">NEW MATCH</button>
</div>

<div class="timer" id="timer">01:00</div>
<div class="roundInfo" id="roundInfo">ROUND 1 / 3</div>

<div class="match">

  <div class="player red">
    <div class="name" id="player1Name">HONG</div>

    <div class="score" id="score1">0</div>

    <div class="scoreButtons">
      <button onclick="changeScore(1,-1)">−</button>
      <button onclick="changeScore(1,1)">+</button>
    </div><div class="gam">
      GAM-JEOM: <span id="gam1">0</span><br>
      <button onclick="giveGamjeom(1)">+ GAM-JEOM</button>
    </div>

    <div class="rounds">
      ROUNDS WON: <span id="rounds1">0</span>
    </div>
  </div>

  <div class="player blue">
    <div class="name" id="player2Name">CHONG</div>

    <div class="score" id="score2">0</div>

    <div class="scoreButtons">
      <button onclick="changeScore(2,-1)">−</button>
      <button onclick="changeScore(2,1)">+</button>
    </div>

    <div class="gam">
      GAM-JEOM: <span id="gam2">0</span><br>
      <button onclick="giveGamjeom(2)">+ GAM-JEOM</button>
    </div>

    <div class="rounds">
      ROUNDS WON: <span id="rounds2">0</span>
    </div>
  </div>

</div>

<div id="winnerText"></div>

<button class="settingsBtn" onclick="openSettings()">
  ⚙ MATCH SETTINGS
</button>


<!-- MATCH WINNER POPUP -->

<div class="popup" id="winnerPopup">

  <div class="popupBox">

    <div class="popupTitle">🏆 MATCH WINNER</div>

    <div class="popupName" id="popupWinnerName">
      HONG
    </div>

    <div class="popupReason" id="popupWinnerReason">
      MATCH WINNER
    </div>

    <button class="popupClose" onclick="closeWinnerPopup()">
      CLOSE
    </button>

  </div>

</div>


<!-- SETTINGS -->

<div class="modal" id="settingsModal">

  <div class="modalBox">

    <h2>⚙ MATCH SETTINGS</h2>

    <label>
